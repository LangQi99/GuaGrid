<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>卦阵 · GuaGrid v1</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" type="module"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand"><span class="mark" aria-hidden="true">☰</span><strong>卦阵</strong><span class="version">GuaGrid v1</span></div>
      <span class="connection" id="connection" role="status">正在连接</span>
    </div>
  </header>

  <main>
    <div class="workspace-bar">
      <div><h1>工作台</h1><div class="workspace" id="workspace"></div></div>
      <dl class="metrics">
        <div><dt>执行中</dt><dd id="running">0</dd></div>
        <div><dt>准备中</dt><dd id="starting">0</dd></div>
        <div><dt>待派发</dt><dd id="queued">0</dd></div>
        <div><dt>已交付</dt><dd id="completed">0</dd></div>
      </dl>
    </div>

    <div class="layout">
      <section class="panel map-panel" aria-labelledby="map-heading">
        <div class="panel-heading"><h2 id="map-heading">八卦</h2><span class="mono muted">Codex × 8</span></div>
        <div class="map" id="map">
          <canvas id="flow-canvas" aria-hidden="true"></canvas>
          <div class="hub" id="hub"><span class="hub-symbol" aria-hidden="true">☯</span><span>太极</span></div>
          <div id="nodes" aria-label="选择一卦"></div>
          <div class="route" id="route">等待任务</div>
        </div>
      </section>

      <div class="sidebar">
        <section class="panel" aria-labelledby="dispatch-heading">
          <div class="panel-heading"><h2 id="dispatch-heading">派活</h2></div>
          <form id="dispatch" class="form">
            <label for="task-input">任务</label>
            <textarea id="task-input" rows="4" placeholder="输入要交给震与兑的任务" required></textarea>
            <div class="dispatch-options">
              <select id="target" aria-label="分配给">
                <option value="step1">Step 1 · 震与兑</option>
                <option value="">自动分派</option>
              </select>
              <label class="checkbox" id="split-option" hidden><input type="checkbox" id="split-lines" checked> 按行拆分</label>
            </div>
            <button class="primary" id="dispatch-submit" type="submit">派给震与兑</button>
            <p class="feedback" id="dispatch-feedback" role="status"></p>
          </form>
        </section>

        <section class="panel detail" aria-labelledby="agent-name">
          <div class="panel-heading">
            <div class="detail-heading"><span id="agent-glyph" class="detail-glyph" aria-hidden="true">☰</span><h2 id="agent-name">乾</h2><span class="muted" id="agent-role"></span></div>
            <span class="muted" id="agent-state"></span>
          </div>
          <div class="detail-body">
            <p class="task-title" id="task-title">等待派活</p>
            <p class="muted detail-note" id="agent-activity"></p>
            <p id="worktree" class="mono worktree" hidden></p>
            <pre id="result" hidden></pre>
            <form class="followup" id="followup">
              <input id="message" placeholder="跟乾说话" aria-label="给当前卦发消息" required>
              <button class="secondary" type="submit">发送</button>
              <button class="secondary stop" id="stop" type="button" hidden>中断</button>
            </form>
            <p class="feedback" id="agent-feedback" role="status"></p>
          </div>
        </section>
      </div>

      <section class="panel flow-panel" aria-labelledby="flow-heading">
        <div class="panel-heading"><h2 id="flow-heading">信息流</h2><span id="event-count" class="mono muted"></span></div>
        <p id="empty-flow" class="empty">派发或者查询任务后，实际事件会出现在这里。</p>
        <ol class="flow-list" id="flow-list"></ol>
      </section>
    </div>
  </main>
</body>
</html>
