<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>卦阵 · GuaGrid</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" type="module"></script>
</head>
<body>
  <div class="shell" id="shell">
    <aside class="sidebar" id="sidebar" aria-label="会话栏">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">☰</span>
        <div><strong>卦阵</strong><span>GuaGrid</span></div>
      </div>
      <button class="new-chat" id="new-session"><span aria-hidden="true">＋</span> 新建会话</button>
      <label class="search"><span aria-hidden="true">⌕</span><input id="session-search" type="search" placeholder="搜索会话" aria-label="搜索会话"></label>
      <nav class="recents" aria-label="会话列表">
        <div class="sidebar-label">最近会话</div>
        <div id="session-list"></div>
      </nav>
      <div class="sidebar-foot">
        <span class="online-dot" id="online-dot"></span>
        <div><span id="connection">正在连接</span><small id="workspace"></small></div>
      </div>
    </aside>

    <main class="chat">
      <header class="chat-header">
        <button class="icon-button sidebar-toggle" id="toggle-sidebar" aria-label="会话栏" title="会话栏">☰</button>
        <div class="chat-heading">
          <h1 id="session-title">新会话</h1>
          <div id="session-meta" class="muted"></div>
        </div>
        <div class="header-actions">
          <button class="quiet-button" id="toggle-replay" hidden><span aria-hidden="true">▶</span> 回放</button>
          <button class="quiet-button" id="toggle-inspector" aria-controls="inspector" aria-expanded="true"><span aria-hidden="true">◫</span> 协作图</button>
        </div>
      </header>

      <div class="channel-strip" id="channel-strip" role="group" aria-label="会话中的对话" hidden></div>

      <div class="chat-scroll" id="chat-scroll" tabindex="0" aria-label="对话记录">
        <div class="chat-content">
          <div class="empty-chat" id="empty-chat">
            <span class="empty-glyph" aria-hidden="true">☰</span>
            <h2 id="empty-title">开始一个新会话</h2>
            <p id="empty-description">说说你想完成的任务。</p>
          </div>
          <div id="timeline" class="timeline"></div>
          <div id="streaming" class="timeline"></div>
        </div>
      </div>

      <footer class="chat-footer">
        <div class="composer-wrap">
          <section class="replay-bar" id="replay-bar" aria-label="Trace 回放控制" hidden>
            <div class="replay-head">
              <div class="replay-buttons">
                <button class="icon-button" id="replay-prev" aria-label="上一条事件" title="上一条事件">‹</button>
                <button class="replay-play" id="replay-play">播放</button>
                <button class="icon-button" id="replay-next" aria-label="下一条事件" title="下一条事件">›</button>
              </div>
              <div class="replay-now" id="replay-now" aria-live="polite"></div>
              <select id="replay-speed" aria-label="回放速度">
                <option value="1">1×</option><option value="2" selected>2×</option><option value="4">4×</option>
              </select>
            </div>
            <input id="replay-position" type="range" min="0" max="0" value="0" aria-label="回放位置">
            <div class="replay-foot"><span id="replay-time"></span><span id="replay-count"></span></div>
          </section>

          <form id="composer" class="composer">
            <textarea id="prompt" rows="2" required aria-label="消息" placeholder="输入任务…"></textarea>
            <div class="composer-bar">
              <select id="target" aria-label="分派方式"></select>
              <span class="model" id="model"></span>
              <div class="composer-actions">
                <button class="icon-button stop" id="stop-task" type="button" aria-label="停止当前对话" title="停止当前对话" hidden>■</button>
                <button class="send" id="send" type="submit" aria-label="发送" title="发送">↑</button>
              </div>
            </div>
          </form>
          <p id="feedback" class="feedback" role="status"></p>
        </div>
      </footer>
    </main>

    <aside class="inspector" id="inspector" aria-label="协作图">
      <div class="inspector-heading"><h2>八卦协作</h2><button class="icon-button" id="close-inspector" aria-label="收起协作图" title="收起">×</button></div>
      <div class="inspector-scroll" id="inspector-scroll">
        <section class="inspector-section flow-section" aria-label="通气">
          <div class="flow-board" id="flow-board" role="group" aria-label="八卦关系图" tabindex="-1">
            <svg viewBox="0 0 100 100" aria-hidden="true" focusable="false">
              <polygon id="flow-outline" class="flow-outline"></polygon>
              <circle class="flow-orbit" cx="50" cy="50" r="27"></circle>
              <g id="flow-edges"></g>
            </svg>
            <div id="members" class="members"></div>
          </div>
          <p id="route-empty" class="route-empty muted">暂无通气</p>
          <button type="button" class="route-card" id="route-open" aria-label="查看这条通气的原文" hidden>
            <span class="route-header">
              <span id="route-label" class="route-tag"></span>
              <strong id="route-actors"></strong>
              <time id="route-time"></time>
              <span aria-hidden="true" class="route-chevron">↗</span>
            </span>
            <span id="route-text" class="route-text"></span>
          </button>
        </section>
        <section class="inspector-section" id="run-section" hidden>
          <div class="section-label">工作进度</div>
          <p id="stage" class="stage"></p>
          <button id="branch" class="branch" type="button" title="复制工作目录" hidden></button>
          <p id="verdict" class="verdict" hidden></p>
        </section>
        <section class="inspector-section" id="trace-section" hidden>
          <div class="section-label">记录</div>
          <p id="trace-meta" class="muted"></p>
          <div id="checkpoints" class="checkpoints"></div>
        </section>
      </div>
    </aside>
  </div>
</body>
</html>
